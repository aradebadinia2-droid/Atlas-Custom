      - name: Scope Windows FFI lint exception to wake event module
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'crates/atlas-ui/src/lib.rs'
          $source = [IO.File]::ReadAllText($path)
          $needle = 'pub mod warm_start {'
          if ([regex]::Matches($source, [regex]::Escape($needle)).Count -ne 1) { throw 'Warm start module not found exactly once' }
          $source = $source.Replace($needle, "#[allow(unsafe_code)]`n$needle")
          [IO.File]::WriteAllText($path, $source, [Text.UTF8Encoding]::new($false))
      - name: Compile original Atlas Windows icon
        shell: pwsh
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $rc = Get-ChildItem $sdk -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64\rc.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $rc) { throw 'Windows SDK resource compiler not found' }
          $ico = (Resolve-Path 'packaging/icons/atlas.ico').Path.Replace('\','/')
          $rcFile = Join-Path $PWD 'atlas-custom-icon.rc'
          $resFile = Join-Path $PWD 'atlas-custom-icon.res'
          ('1 ICON "' + $ico + '"') | Set-Content -Encoding ascii $rcFile
          & $rc /nologo /fo $resFile $rcFile
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $resFile)) { throw 'Icon resource compilation failed' }
          "ATLAS_CUSTOM_ICON_RES=$resFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows Full edition
        shell: pwsh
        run: |
          cargo build --locked --release -p atlas -p atlas-search-service -p atlas-cloud-extension -p atlas-icon-extension
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          & target/release/atlas.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
      - name: Stage portable files
        shell: pwsh
        run: |
          ./scripts/stage-windows-runtime.ps1
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/atlas.exe, target/release/atlas-search-service.exe, target/release/atlas-cloud-extension.exe, target/release/atlas-icon-extension.exe portable/
          Copy-Item target/windows-runtime/* portable/
          Copy-Item LICENSE, NOTICE, custom.patch, warm.patch, v5.patch portable/
          Copy-Item packaging/icons/atlas.ico portable/atlas.ico
          @'
          @echo off
          cd /d "%~dp0"
          set "ATLAS_CONFIG_DIR=%LOCALAPPDATA%\AtlasCustom017\config"
          start "Atlas Custom" "%~dp0atlas.exe"
          '@ | Set-Content -Encoding ascii portable/START-ATLAS.cmd
          @'
          @echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -Command "$s=(New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path ([Environment]::GetFolderPath('Startup')) 'Atlas Background.lnk')); $s.TargetPath=(Join-Path (Get-Location).Path 'atlas.exe'); $s.Arguments='--background'; $s.WorkingDirectory=(Get-Location).Path; $s.Save()"
          if errorlevel 1 (echo Could not enable startup.) else (echo Atlas will preload at your next Windows sign-in.)
          pause
          '@ | Set-Content -Encoding ascii portable/ENABLE-STARTUP.cmd
          @'
          @echo off
          powershell.exe -NoProfile -Command "$p=Join-Path ([Environment]::GetFolderPath('Startup')) 'Atlas Background.lnk'; if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p}"
          echo Atlas startup shortcut removed. Exit Atlas with Ctrl+Q if it is running.
          pause
          '@ | Set-Content -Encoding ascii portable/DISABLE-STARTUP.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Custom-Windows
          path: portable/
          if-no-files-found: error
      - name: Archive corresponding source
        shell: pwsh
        run: |
          git -c user.name='Atlas Custom' -c user.email='build@example.invalid' commit -am 'Custom Full edition, thumbnails, sidebar, Downloads grouping, preload and icon'
          if ($LASTEXITCODE -ne 0) { throw 'Source snapshot failed' }
          git archive --format=zip -o atlas-custom-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Custom-Source
          path: atlas-custom-source.zip
          if-no-files-found: error
