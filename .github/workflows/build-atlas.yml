          git apply custom.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - name: Build Windows Free edition
        shell: pwsh
        run: |
          cargo build --locked --release -p atlas -p atlas-search-service -p atlas-cloud-extension -p atlas-icon-extension --features free
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          & target/release/atlas.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
      - name: Stage portable files
        shell: pwsh
        run: |
          ./scripts/stage-windows-runtime.ps1
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/atlas.exe, target/release/atlas-search-service.exe, target/release/atlas-cloud-extension.exe, target/release/atlas-icon-extension.exe portable/
          Copy-Item target/windows-runtime/* portable/
          Copy-Item LICENSE, NOTICE, custom.patch portable/
          @'
          @echo off
          cd /d "%~dp0"
          set "ATLAS_CONFIG_DIR=%LOCALAPPDATA%\AtlasCustom017\config"
          start "Atlas Custom" "%~dp0atlas.exe"
          '@ | Set-Content -Encoding ascii portable/START-ATLAS.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Custom-Windows
          path: portable/
          if-no-files-found: error
      - name: Archive corresponding source
        shell: pwsh
        run: |
          git -c user.name='Atlas Custom' -c user.email='build@example.invalid' commit -am 'Custom thumbnails, sidebar and Downloads grouping'
          if ($LASTEXITCODE -ne 0) { throw 'Source snapshot failed' }
          git archive --format=zip -o atlas-custom-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Custom-Source
          path: atlas-custom-source.zip
          if-no-files-found: error
